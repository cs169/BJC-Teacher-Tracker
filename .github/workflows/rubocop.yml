name: RuboCop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: default doc job cable storage ujs test db

    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby 3.3.9
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.9
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop --parallel
